<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মিল্ক ফার্মার (Milk Farmer)</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Bengali', sans-serif; background-color: #EDE9DD; }
    .serif { font-family: 'Noto Serif Bengali', serif; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen py-4">
  <div id="root" class="w-full max-w-[400px]"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const COLORS = {
      bg: '#FFFDF7',
      primary: '#1F4D36',
      primaryLight: '#2F6B4A',
      accent: '#E8A33D',
      clay: '#8B5E3C',
      text: '#1A2E22',
      due: '#B24A3E',
      muted: '#A8A08D',
      card: '#FFFFFF',
      line: '#EEE7D6',
    };
    const TARGET = 1000;

    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    const toBn = (num) => String(num).replace(/[0-9]/g, (d) => bnDigits[d]);
    const formatINR = (num) => {
      const n = Math.round(Number(num) || 0);
      const sign = n < 0 ? '-' : '';
      const str = Math.abs(n).toString();
      if (str.length <= 3) return sign + str;
      const last3 = str.slice(-3);
      const rest = str.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      return `${sign}${rest},${last3}`;
    };
    const toBnINR = (num) => toBn(formatINR(num));
    const todayStr = () => new Date().toISOString().slice(0, 10);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const fmtDate = (ds) => {
      const d = new Date(ds + 'T00:00:00');
      return d.toLocaleDateString('bn-IN', { day: 'numeric', month: 'short' });
    };
    const buildWaLink = (phone, msg) => {
      const cleanPhone = (phone || '').replace(/\D/g, '');
      const encodedMsg = encodeURIComponent(msg);
      return cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodedMsg}` : `https://wa.me/?text=${encodedMsg}`;
    };

    const DEFAULT_DATA = { production: [], sales: [], settings: { upiId: '', farmerName: '', reportPhone: '' } };

    function App() {
      const [data, setData] = useState(DEFAULT_DATA);
      const [loaded, setLoaded] = useState(false);
      const [tab, setTab] = useState('home');
      const [showProdForm, setShowProdForm] = useState(false);
      const [showSaleForm, setShowSaleForm] = useState(false);

      useEffect(() => {
        try {
          const stored = localStorage.getItem('milk-farmer-data');
          if (stored) {
            const parsed = JSON.parse(stored);
            setData({ ...DEFAULT_DATA, ...parsed, settings: { ...DEFAULT_DATA.settings, ...(parsed.settings || {}) } });
          }
        } catch (e) { console.error(e); }
        setLoaded(true);
      }, []);

      const save = useCallback((next) => {
        setData(next);
        try { localStorage.setItem('milk-farmer-data', JSON.stringify(next)); }
        catch (e) { console.error(e); }
      }, []);

      const addProduction = (entry) => {
        save({ ...data, production: [{ id: uid(), date: todayStr(), ...entry }, ...data.production] });
        setShowProdForm(false);
      };
      const addSale = (entry) => {
        save({ ...data, sales: [{ id: uid(), date: todayStr(), paid: false, ...entry }, ...data.sales] });
        setShowSaleForm(false);
      };
      const deleteEntry = (kind, id) => save({ ...data, [kind]: data[kind].filter((e) => e.id !== id) });
      const togglePaid = (id) => save({ ...data, sales: data.sales.map((s) => (s.id === id ? { ...s, paid: !s.paid } : s)) });
      const updateSettings = (next) => save({ ...data, settings: { ...data.settings, ...next } });

      const today = todayStr();
      const todayProd = data.production.filter((p) => p.date === today).reduce((a, b) => a + Number(b.liters), 0);
      const todayProdValue = data.production.filter((p) => p.date === today).reduce((a, b) => a + (Number(b.value) || 0), 0);
      const todaySalesLiters = data.sales.filter((s) => s.date === today).reduce((a, b) => a + Number(b.liters), 0);
      const todayRevenue = data.sales.filter((s) => s.date === today).reduce((a, b) => a + Number(b.amount), 0);
      const totalDue = data.sales.filter((s) => !s.paid).reduce((a, b) => a + Number(b.amount), 0);
      const pct = Math.min(100, Math.round((todayProd / TARGET) * 100));

      const customerMap = {};
      data.sales.forEach((s) => {
        if (!customerMap[s.customer]) customerMap[s.customer] = { name: s.customer, liters: 0, due: 0, spent: 0, phone: s.phone || '' };
        customerMap[s.customer].liters += Number(s.liters);
        customerMap[s.customer].spent += Number(s.amount);
        if (!s.paid) customerMap[s.customer].due += Number(s.amount);
        if (s.phone) customerMap[s.customer].phone = s.phone;
      });
      const customerList = Object.values(customerMap).sort((a, b) => b.due - a.due);

      if (!loaded) return <div className="text-center py-20 text-emerald-800">লোড হচ্ছে...</div>;

      return (
        <div className="relative w-full h-[800px] rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col" style={{ background: COLORS.bg, border: '8px solid #16281E' }}>
          <div className="px-5 pt-6 pb-5 rounded-b-[2rem] shrink-0" style={{ background: `linear-gradient(135deg, ${COLORS.primary}, ${COLORS.primaryLight})` }}>
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-white text-2xl font-bold serif">মিল্ক ফার্মার</h1>
                <p className="text-sm mt-0.5" style={{ color: COLORS.accent }}>
                  {new Date().toLocaleDateString('bn-IN', { weekday: 'long', day: 'numeric', month: 'long' })}
                </p>
              </div>
              <div className="w-11 h-11 rounded-full flex items-center justify-center text-white" style={{ background: COLORS.accent }}>
                💧
              </div>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto px-4 pb-24 pt-4" style={{ color: COLORS.text }}>
            {tab === 'home' && (
              <HomeTab
                todayProd={todayProd} todayProdValue={todayProdValue}
                todaySalesLiters={todaySalesLiters} todayRevenue={todayRevenue}
                totalDue={totalDue} pct={pct} settings={data.settings}
                onSaveSettings={updateSettings}
                onQuickProd={() => { setTab('production'); setShowProdForm(true); }}
                onQuickSale={() => { setTab('sales'); setShowSaleForm(true); }}
              />
            )}
            {tab === 'production' && (
              <ProductionTab
                entries={data.production} onDelete={(id) => deleteEntry('production', id)}
                showForm={showProdForm} setShowForm={setShowProdForm} onAdd={addProduction}
              />
            )}
            {tab === 'sales' && (
              <SalesTab
                entries={data.sales} onDelete={(id) => deleteEntry('sales', id)}
                onTogglePaid={togglePaid} showForm={showSaleForm} setShowForm={setShowSaleForm}
                onAdd={addSale}
              />
            )}
            {tab === 'customers' && <CustomersTab customers={customerList} settings={data.settings} />}
          </div>

          <div className="absolute bottom-0 left-0 right-0 flex items-center justify-around py-3 px-2 border-t shrink-0" style={{ background: COLORS.card, borderColor: COLORS.line }}>
            <button onClick={() => setTab('home')} className={`flex flex-col items-center text-[10px] ${tab === 'home' ? 'font-bold text-emerald-800' : 'text-gray-400'}`}>🏠 হোম</button>
            <button onClick={() => setTab('production')} className={`flex flex-col items-center text-[10px] ${tab === 'production' ? 'font-bold text-emerald-800' : 'text-gray-400'}`}>💧 উৎপাদন</button>
            <button onClick={() => setTab('sales')} className={`flex flex-col items-center text-[10px] ${tab === 'sales' ? 'font-bold text-emerald-800' : 'text-gray-400'}`}>💰 বিক্রয়</button>
            <button onClick={() => setTab('customers')} className={`flex flex-col items-center text-[10px] ${tab === 'customers' ? 'font-bold text-emerald-800' : 'text-gray-400'}`}>👥 গ্রাহক</button>
          </div>
        </div>
      );
    }

    function HomeTab({ todayProd, todayProdValue, todaySalesLiters, todayRevenue, totalDue, pct, settings, onSaveSettings, onQuickProd, onQuickSale }) {
      const [showSettings, setShowSettings] = useState(false);
      const [upiId, setUpiId] = useState(settings.upiId || '');
      const [farmerName, setFarmerName] = useState(settings.farmerName || '');

      return (
        <div className="space-y-4">
          <div className="rounded-3xl p-5 flex items-center gap-5" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
            <div className="relative w-24 h-24 shrink-0 flex items-center justify-center rounded-full border-4 border-amber-400 bg-amber-50">
              <div className="text-center">
                <span className="text-2xl font-bold" style={{ color: COLORS.primary }}>{toBn(todayProd)}</span>
                <p className="text-[10px]" style={{ color: COLORS.muted }}>লিটার</p>
              </div>
            </div>
            <div>
              <p className="text-sm font-semibold" style={{ color: COLORS.primary }}>আজকের উৎপাদন</p>
              <p className="text-xs mt-1" style={{ color: COLORS.muted }}>লক্ষ্যমাত্রা {toBn(TARGET)} লিটারের {toBn(pct)}%</p>
              {todayProdValue > 0 && <p className="text-xs mt-1 font-semibold" style={{ color: COLORS.clay }}>মূল্য: ₹{toBnINR(todayProdValue)}</p>}
            </div>
          </div>

          <div className="flex gap-3">
            <div className="rounded-2xl p-3 flex-1 bg-white border border-amber-100">
              <p className="text-[11px] text-gray-400">আজকের বিক্রি</p>
              <p className="text-lg font-bold" style={{ color: COLORS.primary }}>{toBn(todaySalesLiters)} <span className="text-xs">লি.</span></p>
            </div>
            <div className="rounded-2xl p-3 flex-1 bg-white border border-amber-100">
              <p className="text-[11px] text-gray-400">আজকের আয়</p>
              <p className="text-lg font-bold" style={{ color: COLORS.clay }}>₹{toBnINR(todayRevenue)}</p>
            </div>
          </div>

          <div className="rounded-2xl p-3 bg-white border border-amber-100">
            <p className="text-[11px] text-gray-400">মোট বকেয়া</p>
            <p className="text-lg font-bold" style={{ color: totalDue > 0 ? COLORS.due : COLORS.primary }}>₹{toBnINR(totalDue)}</p>
          </div>

          <div className="flex gap-3">
            <button onClick={onQuickProd} className="flex-1 rounded-2xl py-3 text-white text-sm font-semibold" style={{ background: COLORS.primary }}>+ উৎপাদন যোগ</button>
            <button onClick={onQuickSale} className="flex-1 rounded-2xl py-3 text-white text-sm font-semibold" style={{ background: COLORS.accent }}>+ বিক্রয় যোগ</button>
          </div>

          <div className="rounded-2xl p-4 bg-white border border-amber-100">
            <button onClick={() => setShowSettings(!showSettings)} className="w-full flex items-center justify-between font-semibold text-sm" style={{ color: COLORS.primary }}>
              ⚙️ পেমেন্ট QR সেটিংস (UPI)
              <span className="text-xs font-normal text-gray-400">{settings.upiId ? 'সেট করা আছে' : 'সেট করুন'}</span>
            </button>
            {showSettings && (
              <div className="mt-3 space-y-2">
                <input type="text" placeholder="আপনার নাম" value={farmerName} onChange={(e) => setFarmerName(e.target.value)} className="w-full rounded-xl p-2 text-sm border" />
                <input type="text" placeholder="UPI আইডি (যেমন 9876543210@upi)" value={upiId} onChange={(e) => setUpiId(e.target.value)} className="w-full rounded-xl p-2 text-sm border" />
                <button onClick={() => { onSaveSettings({ upiId, farmerName }); setShowSettings(false); }} className="w-full rounded-xl py-2 text-white text-sm font-semibold" style={{ background: COLORS.primary }}>সেভ করুন</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ProductionTab({ entries, onDelete, showForm, setShowForm, onAdd }) {
      const [session, setSession] = useState('সকাল');
      const [liters, setLiters] = useState('');
      const [rate, setRate] = useState('40');
      const [note, setNote] = useState('');

      const submit = () => {
        if (!liters || Number(liters) <= 0) return;
        onAdd({ session, liters: Number(liters), rate: Number(rate) || 0, value: Math.round(Number(liters) * Number(rate)), note });
        setLiters(''); setNote('');
      };

      return (
        <div>
          <div className="flex justify-between items-center mb-3">
            <h2 className="font-bold text-emerald-900 serif">দুধ উৎপাদন</h2>
            <button onClick={() => setShowForm(!showForm)} className="w-8 h-8 rounded-full bg-emerald-800 text-white font-bold">{showForm ? '✕' : '+'}</button>
          </div>

          {showForm && (
            <div className="rounded-2xl p-4 mb-4 bg-white border space-y-3">
              <div className="flex gap-2">
                {['সকাল', 'দুপুর', 'বিকাল', 'রাত'].map((s) => (
                  <button key={s} onClick={() => setSession(s)} className={`flex-1 py-1 text-xs rounded-lg ${session === s ? 'bg-emerald-800 text-white' : 'bg-gray-100'}`}>{s}</button>
                ))}
              </div>
              <div className="flex gap-2">
                <input type="number" placeholder="লিটার" value={liters} onChange={(e) => setLiters(e.target.value)} className="flex-1 p-2 text-sm border rounded-xl" />
                <input type="number" placeholder="দর (₹)" value={rate} onChange={(e) => setRate(e.target.value)} className="w-24 p-2 text-sm border rounded-xl" />
              </div>
              <input type="text" placeholder="নোট (ঐচ্ছিক)" value={note} onChange={(e) => setNote(e.target.value)} className="w-full p-2 text-sm border rounded-xl" />
              <button onClick={submit} className="w-full py-2 bg-emerald-800 text-white text-sm font-semibold rounded-xl">সংরক্ষণ করুন</button>
            </div>
          )}

          <div className="space-y-2">
            {entries.map((item) => (
              <div key={item.id} className="rounded-2xl p-3 bg-white border flex justify-between items-center">
                <div>
                  <p className="text-sm font-semibold">{toBn(item.liters)} লিটার ({item.session})</p>
                  <p className="text-[10px] text-gray-400">{fmtDate(item.date)} {item.note && `• ${item.note}`}</p>
                </div>
                <div className="flex items-center gap-3">
                  <p className="text-sm font-bold text-emerald-800">₹{toBnINR(item.value || item.liters * item.rate)}</p>
                  <button onClick={() => onDelete(item.id)} className="text-red-400 text-xs">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SalesTab({ entries, onDelete, onTogglePaid, showForm, setShowForm, onAdd }) {
      const [customer, setCustomer] = useState('');
      const [phone, setPhone] = useState('');
      const [liters, setLiters] = useState('');
      const [rate, setRate] = useState('50');

      const submit = () => {
        if (!customer || !liters) return;
        onAdd({ customer: customer.trim(), phone: phone.trim(), liters: Number(liters), rate: Number(rate), amount: Math.round(Number(liters) * Number(rate)) });
        setCustomer(''); setPhone(''); setLiters('');
      };

      return (
        <div>
          <div className="flex justify-between items-center mb-3">
            <h2 className="font-bold text-emerald-900 serif">দুধ বিক্রয়</h2>
            <button onClick={() => setShowForm(!showForm)} className="w-8 h-8 rounded-full bg-amber-500 text-white font-bold">{showForm ? '✕' : '+'}</button>
          </div>

          {showForm && (
            <div className="rounded-2xl p-4 mb-4 bg-white border space-y-3">
              <input type="text" placeholder="গ্রাহকের নাম" value={customer} onChange={(e) => setCustomer(e.target.value)} className="w-full p-2 text-sm border rounded-xl" />
              <input type="tel" placeholder="মোবাইল নম্বর" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full p-2 text-sm border rounded-xl" />
              <div className="flex gap-2">
                <input type="number" placeholder="লিটার" value={liters} onChange={(e) => setLiters(e.target.value)} className="flex-1 p-2 text-sm border rounded-xl" />
                <input type="number" placeholder="দর (₹)" value={rate} onChange={(e) => setRate(e.target.value)} className="w-24 p-2 text-sm border rounded-xl" />
              </div>
              <button onClick={submit} className="w-full py-2 bg-amber-500 text-white text-sm font-semibold rounded-xl">বিক্রয় যোগ করুন</button>
            </div>
          )}

          <div className="space-y-2">
            {entries.map((item) => (
              <div key={item.id} className="rounded-2xl p-3 bg-white border flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <button onClick={() => onTogglePaid(item.id)}>{item.paid ? '✅' : '⚪'}</button>
                  <div>
                    <p className="text-sm font-semibold">{item.customer}</p>
                    <p className="text-[10px] text-gray-400">{toBn(item.liters)} লিটার • {fmtDate(item.date)}</p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <p className={`text-sm font-bold ${item.paid ? 'text-emerald-800' : 'text-red-600'}`}>₹{toBnINR(item.amount)}</p>
                    <span className={`text-[9px] px-1.5 py-0.5 rounded-full ${item.paid ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{item.paid ? 'পরিশোধিত' : 'বকেয়া'}</span>
                  </div>
                  <button onClick={() => onDelete(item.id)} className="text-red-400 text-xs">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CustomersTab({ customers, settings }) {
      const [qrModal, setQrModal] = useState(null);

      return (
        <div>
          <h2 className="font-bold text-emerald-900 serif mb-3">গ্রাহক তালিকা</h2>
          <div className="space-y-3">
            {customers.map((c) => (
              <div key={c.name} className="rounded-2xl p-4 bg-white border">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-bold text-sm">{c.name}</h3>
                    <p className="text-xs text-gray-400">মোট ক্রয়: {toBn(c.liters)} লিটার</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xs text-gray-400">বকেয়া</p>
                    <p className={`text-base font-bold ${c.due > 0 ? 'text-red-600' : 'text-emerald-800'}`}>₹{toBnINR(c.due)}</p>
                  </div>
                </div>

                <div className="flex gap-2 mt-3 pt-3 border-t">
                  {c.phone && (
                    <a href={buildWaLink(c.phone, `প্রিয় ${c
